location:
  name: "Tucson, Arizona"
  latitude: 32.2226
  longitude: -110.9747
  timezone: "America/Phoenix"

light:
  dawn_brightness: 40
  peak_brightness: 100
  curve_factor: 5.0        # Controls exponential steepness (sunrise→noon ramp, holds at peak noon→sunset)

pump:
  runs_per_day: 4
  run_duration_minutes: 2
  speed: 60

scheduler:
  reconcile_interval_seconds: 60

# Auto-dose nutrient controller. Disabled by default; flip enabled to true once
# the Atlas EZO circuits + peristaltic pumps are wired and calibrated.
nutrients:
  enabled: false
  ph:
    target_min: 5.8
    target_max: 6.2
    dose_ml: 1.0
    cooldown_minutes: 30
  ec:
    target_min: 1.2
    target_max: 1.8
    dose_a_ml: 5.0
    dose_b_ml: 5.0
    cooldown_minutes: 30

dose_pumps:
  ph_down:
    enabled: true
    product: "pH Down (food-grade phosphoric acid, 25%)"
    flow_rate_ml_per_sec: 1.67
    max_dose_ml: 10
  nutrient_a:
    enabled: true
    product: "General Hydroponics 718125 Flora Micro"
    flow_rate_ml_per_sec: 1.67
    max_dose_ml: 20
  nutrient_b:
    enabled: true
    product: "General Hydroponics FloraBloom 0-5-4"
    flow_rate_ml_per_sec: 1.67
    max_dose_ml: 20
  # Cal-mag is dosed manually or on a weekly schedule, not by reactive
  # setpoint control. Reconciler ignores this pump; the Dose button on
  # the dashboard is the primary way to use it.
  cal_mag:
    enabled: true
    product: "General Hydroponics CALiMAGic"
    flow_rate_ml_per_sec: 1.67
    max_dose_ml: 15
